name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build (skips release-please)"
        required: true
        type: string

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  android-build:
    runs-on: ubuntu-latest
    name: Android Build & Submit
    needs: release
    if: |
      always() &&
      (needs.release.outputs.release_created == 'true' || github.event.inputs.tag_name != '')

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag_name || needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Patch system watchers for ENOSPC
        run: |
          sudo sysctl fs.inotify.max_user_instances=524288
          sudo sysctl fs.inotify.max_user_watches=524288
          sudo sysctl fs.inotify.max_queued_events=524288

      - name: Build
        run: pnpm exec eas build --platform android --profile production --local --output ./app-build --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit
        run: pnpm exec eas submit --platform android --profile production --path ./app-build --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ios-build:
    runs-on: macos-26
    name: iOS Build & Upload
    needs: release
    # Disabled because we do not have an Apple Developer account to sign iOS binaries.
    # if: |
    #   always() &&
    #   (needs.release.outputs.release_created == 'true' || github.event.inputs.tag_name != '')
    if: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag_name || needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Set Xcode version
        run: sudo xcode-select --switch "/Applications/Xcode_26.6.app/Contents/Developer"

      - name: Build
        run: pnpm exec eas build --platform ios --profile production --local --non-interactive --output ./app-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload
        run: pnpm exec eas upload --platform ios --build-path ./app-build --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
